name: Auto PR to main

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [develop]

permissions:
  contents: write
  pull-requests: write

jobs:
  open-and-merge-pr:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Create or update pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            number="$existing"
          else
            url=$(gh pr create \
              --base main \
              --head develop \
              --title "chore: 同步 develop 到 main" \
              --body "由 CI 自動建立：develop 分支測試已通過，合併至 main。" || true)
            number=$(basename "$url" 2>/dev/null || true)
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge "${{ steps.pr.outputs.number }}" --auto --squash
