services:
  app:
    image: meykatoe/aboutme:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_NAME: aboutMe
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8080
      APP_LOCALE: zh_TW
      APP_FALLBACK_LOCALE: en
      LOG_CHANNEL: stack
      LOG_LEVEL: error
      DB_CONNECTION: sqlite
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: local
      # ALTCHA_HMAC_KEY: 請自行設定一組隨機字串以啟用 /register 的人機驗證
      # ADMIN_EMAIL: admin@example.com
    volumes:
      - aboutme-database:/var/www/html/database
      - aboutme-storage:/var/www/html/storage/app

volumes:
  aboutme-database:
  aboutme-storage:
